<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1400px;height:560px;overflow:hidden}
body{background:linear-gradient(120deg,#1f4fd8 0%,#2a2f8f 60%,#1d1f4a 100%);font-family:system-ui,-apple-system,sans-serif;color:#fff;display:flex;align-items:center}
.text{padding-left:90px;width:600px}
.row{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.row img{width:84px;height:84px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
h1{margin:0;font-size:64px;font-weight:700;letter-spacing:-1px}
h2{margin:0 0 18px;font-size:34px;font-weight:600;line-height:1.25}
p{margin:0;font-size:21px;opacity:.85;line-height:1.5}
.demo{position:relative;flex:1;height:100%}
.art{position:absolute;left:20px;top:60px;width:300px;height:440px;border-radius:10px;background:url(art.jpg) center/cover;box-shadow:0 16px 48px rgba(0,0,0,.45)}
.menu{position:absolute;left:180px;top:110px;background:#2b2b30;color:#ececef;border-radius:8px;padding:6px 0;font-size:15px;width:230px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu div{padding:7px 16px;color:#9a9aa3}
.menu .hi{background:#3d5bd9;color:#fff;display:flex;align-items:center;gap:8px}
.menu .hi img{width:16px;height:16px;border-radius:3px}
.card{position:absolute;left:370px;top:290px;width:302px;border-radius:10px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
</style></head><body>
<div class="text">
  <div class="row"><img src="icon.png"><h1>foidfinder</h1></div>
  <h2>Name the character, series and artist in any anime image.</h2>
  <p>Right-click a picture and the answer appears in a corner card. The model runs on your GPU, so images never leave your computer.</p>
</div>
<div class="demo">
  <div class="art"></div>
  <div class="menu"><div>Open image in new tab</div><div>Save image as…</div><div>Copy image</div><div class="hi"><img src="icon.png">Identify with foidfinder</div></div>
  <img class="card" src="card.png">
</div>
</body></html>
