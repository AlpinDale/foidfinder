[project]
name = "foidfinder"
version = "0.2.0"
description = "Identify anime characters and series in images"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.26",
    "numpy>=2.0",
    "pillow>=11.0",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# Apple Silicon GPU.
mlx = ["mlx>=0.29; sys_platform == 'darwin'"]
# NVIDIA GPUs, compute capability 8.0+. Kernels are JIT-built with the local CUDA toolkit (12.8+) unless
# FOIDFINDER_KERNELS points at a prebuilt library (the Docker image does this).
cuda = [
    "ninja",
    "safetensors>=0.4",
    "torch>=2.9",
]

[project.scripts]
foidfinder = "foidfinder.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
# Official PixAI implementation, for tests/test_mlx_parity.py and tests/test_cuda_engine.py.
parity = [
    "timm>=1.0",
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=4.46",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foidfinder"]
# Built by `npm run build` in web/ (gitignored, shipped in the wheel).
artifacts = ["foidfinder/webui"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "RUF"]
